# Vista Platform Core: image-only Docker Compose install (single host).
#
# Generated by Vista Platform's release tooling from its service registry; do
# not edit by hand. A release attaches a copy with every image pinned to that
# release's version and digest: use that copy, not this template, whose
# __VISTA_VERSION__ placeholders name no real image.
#
#   umask 077
#   for v in POSTGRES_PASSWORD REDIS_PASSWORD NATS_PASSWORD JWT_SECRET INTERNAL_AUTH_SECRET ENCRYPTION_MASTER_KEY; do
#     echo "$v=$(openssl rand -hex 32)"; done > .env
#   docker compose up -d
#
# Then open http://localhost:3000 and sign up: the first account creates the
# organization. INSTALL.md explains the rest, including what this install is
# not (one host, no service mesh, agents on this host only).

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: crypto_inventory
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U crypto_user -d crypto_inventory
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  redis:
    image: valkey/valkey:8.1.10-alpine
    command: valkey-server --dbfilename valkey-dump.rdb --appenddirname valkey-appendonlydir --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  nats:
    image: nats:2.14.8-alpine3.22
    command:
      - -js
      - -m
      - "8222"
      - --user
      - nats_user
      - --pass
      - ${NATS_PASSWORD:?Set NATS_PASSWORD in .env}
    volumes:
      - nats_data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost:8222/healthz
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  schema:
    image: ghcr.io/vistasecurity/schema:__VISTA_VERSION__
    volumes:
      - schema-sql-__VISTA_VERSION__:/sql
    restart: "no"
  db-migrate:
    image: postgres:17.11-alpine3.24
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: crypto_user
      PGDATABASE: crypto_inventory
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - schema-sql-__VISTA_VERSION__:/sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        want='__SCHEMA_SHA256__'
        got=$$(sha256sum /sql/schema.sql | cut -d' ' -f1)
        if [ "$$got" != "$$want" ]; then
          echo "db-migrate: the schema image carries schema $$got, this compose file was stamped for $$want: use the schema image of the same release"
          exit 1
        fi
        until pg_isready -q; do sleep 2; done
        echo "db-migrate: applying schema $$want"
        psql -v ON_ERROR_STOP=1 -q -f /sql/schema.sql
        psql -v ON_ERROR_STOP=1 -q -c "CREATE TABLE IF NOT EXISTS public.schema_migration_status (schema_hash text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now()); ALTER TABLE public.schema_migration_status ADD COLUMN IF NOT EXISTS app_version text; ALTER TABLE public.schema_migration_status ADD COLUMN IF NOT EXISTS chart_version text; INSERT INTO public.schema_migration_status (schema_hash, app_version, chart_version) VALUES ('$$want', '__VISTA_VERSION__', 'compose') ON CONFLICT (schema_hash) DO UPDATE SET applied_at = now(), app_version = EXCLUDED.app_version, chart_version = EXCLUDED.chart_version;"
        echo "db-migrate: granting the row-level-security roles their login"
        printf "ALTER ROLE crypto_app LOGIN PASSWORD :'pw';\nALTER ROLE crypto_bypass LOGIN PASSWORD :'pw';\n" | psql -v ON_ERROR_STOP=1 -q -v pw="$$PGPASSWORD"
        echo "db-migrate: applying seed data"
        psql -q -f /sql/seed.sql >/dev/null
        echo "db-migrate: done"
    depends_on:
      postgres:
        condition: service_healthy
      schema:
        condition: service_completed_successfully
    restart: "no"
  auth-service:
    image: ghcr.io/vistasecurity/auth-service:__VISTA_VERSION__
    environment:
      - ENV=production
      - LOG_LEVEL=info
      - USE_MTLS=false
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ORIGINS=http://localhost:${WEB_UI_HOST_PORT:-3000},http://localhost:${ADMIN_UI_HOST_PORT:-3006}
