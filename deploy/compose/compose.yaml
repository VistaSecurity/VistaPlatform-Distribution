              accessControlMaxAge: 86400
              addVaryHeader: true
          security-headers:
            headers:
              frameDeny: true
              contentTypeNosniff: true
              browserXssFilter: false
              referrerPolicy: strict-origin-when-cross-origin
              contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:
                https:; font-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self';
                frame-ancestors 'none';"
              customResponseHeaders:
                Permissions-Policy: camera=(), microphone=(), geolocation=()
                X-XSS-Protection: "0"
          strip-backend-cors:
            headers:
              customResponseHeaders:
                Access-Control-Allow-Origin: ""
                Access-Control-Allow-Methods: ""
                Access-Control-Allow-Headers: ""
                Access-Control-Allow-Credentials: ""
                Access-Control-Max-Age: ""
          rate-limit-api:
            rateLimit:
              average: 100
              burst: 200
          rate-limit-auth:
            rateLimit:
              average: 20
              burst: 50
          compress:
            compress:
              minResponseBodyBytes: 1024
          body-size-limit:
            buffering:
              maxRequestBodyBytes: 104857600
          retry:
            retry:
              attempts: 3
              initialInterval: 100ms
          deny-admin-plane: &a5
            ipAllowList:
              sourceRange:
