configs:
  traefik-static:
    content: |
      global:
        checkNewVersion: false
        sendAnonymousUsage: false
      entryPoints:
        web:
          address: :80
          http:
            aliasHeadersStrategy: delete
        metrics:
          address: :8099
          http:
            aliasHeadersStrategy: delete
        traefik:
          address: :8080
          http:
            aliasHeadersStrategy: delete
      ping:
        entryPoint: web
      metrics:
        prometheus:
          entryPoint: metrics
          addEntryPointsLabels: true
          addRoutersLabels: true
          addServicesLabels: true
      accessLog:
        format: common
        fields:
          headers:
            defaultMode: drop
            names:
              X-Forwarded-For: keep
              X-Real-Ip: keep
              User-Agent: keep
              Origin: keep
      log:
        level: INFO
      providers:
        file:
          filename: /etc/traefik/dynamic.yaml
          watch: true
      api:
        dashboard: true
        insecure: true
  traefik-dynamic:
    content: |
      http:
        routers:
          health-health:
            rule: Path(`/health`)
            entryPoints: &a1
              - web
            service: ping@internal
            priority: 9999
            middlewares: []
          health-api-health:
            rule: Path(`/api/health`)
            entryPoints: *a1
            service: ping@internal
            priority: 9999
            middlewares:
              - cors-headers
          health-api-v1-health:
            rule: Path(`/api/v1/health`)
            entryPoints: *a1
            service: ping@internal
            priority: 9999
            middlewares:
              - cors-headers
          health-api-v2-health:
            rule: Path(`/api/v2/health`)
            entryPoints: *a1
            service: ping@internal
            priority: 9999
            middlewares:
              - cors-headers
          auth_service_v1:
            rule: PathPrefix(`/api/v1/auth-service/`)
            entryPoints: *a1
            service: auth_service
            middlewares:
              - cors-headers
              - strip-backend-cors
              - security-headers
              - rate-limit-auth
              - compress
              - body-size-limit
              - retry
            priority: 100
          auth_service_health:
            rule: Path(`/api/v1/auth-service/health`)
            entryPoints: *a1
            service: auth_service_health
            middlewares:
              - rewrite-auth-service-api-v1-health
              - retry
            priority: 950
          auth_sso_providers_v1:
            rule: Path(`/api/v1/auth-service/auth/sso/providers`)
            entryPoints: *a1
            service: auth_service
            middlewares: &a2
              - cors-headers
              - strip-backend-cors
              - security-headers
              - compress
              - body-size-limit
              - retry
            priority: 200
          auth_oauth_well_known:
            rule: Path(`/.well-known/oauth-authorization-server`)
            entryPoints: *a1
            service: auth_service
            middlewares: *a2
            priority: 9000
          inventory_service_v1:
            rule: PathPrefix(`/api/v1/inventory-service/`)
            entryPoints: *a1
            service: inventory_service
            middlewares:
              - cors-headers
              - strip-backend-cors
              - security-headers
              - rate-limit-api
              - compress
              - body-size-limit
              - retry
            priority: 100
          inventory_service_health:
