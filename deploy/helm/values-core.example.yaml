# Vista Platform Core: a starting values file for the Helm chart
# oci://ghcr.io/vistasecurity/vistaplatform. Copy it, replace every
# example.com hostname and the issuer name with yours, and install at an exact
# chart version (deploy/helm/README.md). Everything not set here keeps the
# chart's default; `helm show values` at that version lists them all.
#
# The published chart already names the Core images on ghcr.io/vistasecurity
# and pins each one by digest: do not set image tags or digests here.

tls:
  # A real certificate from cert-manager, renewed automatically. The issuer is
  # one your cluster already has (for example an ACME ClusterIssuer).
  mode: certManager
  # The web UI and the API.
  dnsName: vista.example.com
  # The admin console, on its own hostname so the platform-admin API is not
  # served on the tenant host.
  adminDnsName: admin.vista.example.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod

# Sensors and device agents authenticate every call after enrollment with the
# client certificate they were issued, over a TLS-passthrough listener. This is
# always on; each service needs its own hostname, resolving to the passthrough
# entrypoint (deploy/helm/README.md, prerequisites).
agentMtls:
  port: 8444
  entryPoint: agent-mtls
  backends:
    sensor-manager:
      dnsName: sensors.vista.example.com
    device-interrogation-service:
      dnsName: agents.vista.example.com

# The chart generates the platform secrets on first install and reads them back
# on every upgrade. To manage them yourself (recommended for GitOps tools, which
# cannot read them back), pre-create the Secrets and name them instead:
#   platform:
#     generateSecrets: false
#     existingSecretName: vista-platform-secrets
#     existingDatastoreSecretName: vista-datastore-secrets
platform:
  generateSecrets: true

datastores:
  # The cluster's default StorageClass when empty. Pin it before an upgrade
  # if the release already uses one: volume claim templates are immutable.
  storageClassName: ""
